name: Desktop cross-platform
on:
  pull_request:
  push:
    branches: [main, codex/windows-2022-flight-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json
      - run: npm --prefix server ci --include=optional
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run check
      - run: npm --prefix desktop audit --omit=dev --audit-level=high
      - name: Desktop launches and renderer is ready
        run: npm --prefix desktop run smoke
        timeout-minutes: 2
      - name: Personality warning remains visible and never offers copying
        run: npm --prefix desktop run smoke:personality
        timeout-minutes: 2
      - name: Diagnose repeated screenshot flights
        shell: pwsh
        run: |
          $failed = 0
          1..40 | ForEach-Object {
            npm --prefix desktop run smoke:motion
            if ($LASTEXITCODE -ne 0) { $failed++ }
            if (Test-Path desktop/test-output/motion) {
              Move-Item desktop/test-output/motion "desktop/test-output/motion-run-$_"
            }
          }
          Write-Output "Failed original assertions: $failed / 40"
          if ($failed -gt 0) { exit 1 }
        timeout-minutes: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/candidates/*/*.zip
            desktop/dist/candidates/*/*.exe
            desktop/dist/candidates/*/delivery-manifest.json
            desktop/test-output/
            output/windows-delivery/manifest.json
            dist/candidates/*/*.dmg
            dist/candidates/*/delivery-manifest.json
            output/shared-change-proof/result.json
            output/shared-change-proof/*.log
          if-no-files-found: warn
# This workflow creates review artifacts only. Publishing and production signing are separate,
# explicit release actions; no production endpoints, deployment credentials, or account keys.

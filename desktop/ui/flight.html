<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'"
    />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      .photo {
        position: absolute;
        box-sizing: border-box;
        transform-origin: center;
        overflow: hidden;
      }
      .photo img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <script type="module" src="flight.mjs"></script>
  </body>
</html>
